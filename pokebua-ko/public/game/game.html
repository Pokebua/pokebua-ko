<!DOCTYPE html>
<html lang="no">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Pokebua – Last Trainer Standing</title>

  <script src="/socket.io/socket.io.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #06101d;
      color: white;
    }

    body {
      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(42, 98, 172, 0.32),
          transparent 38%
        ),
        linear-gradient(
          180deg,
          #0b1930 0%,
          #06101d 72%
        );
    }

    .game {
      position: relative;

      width: 100vw;
      height: 100vh;

      overflow: hidden;
    }

    .background-grid {
      position: absolute;
      inset: 0;

      opacity: 0.09;

      background-image:
        linear-gradient(
          rgba(255,255,255,0.08) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.08) 1px,
          transparent 1px
        );

      background-size:
        55px 55px;

      pointer-events: none;
    }

    /* =====================================================
       TOP BAR
    ===================================================== */

    .topbar {
      position: absolute;

      z-index: 30;

      top: 20px;
      left: 28px;
      right: 28px;

      height: 92px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 26px;

      border-radius: 18px;

      background:
        rgba(
          7,
          15,
          28,
          0.91
        );

      border:
        1px solid
        rgba(
          91,
          140,
          206,
          0.45
        );

      box-shadow:
        0 14px 45px
        rgba(
          0,
          0,
          0,
          0.35
        );

      backdrop-filter:
        blur(15px);
    }

    .brand {
      display: flex;

      align-items: center;

      gap: 18px;
    }

    .logo {
      width: 112px;

      max-height: 68px;

      object-fit: contain;
    }

    .title-wrap h1 {
      margin: 0;

      font-size: 33px;

      line-height: 1;

      font-weight: 900;
    }

    .title-wrap p {
      margin:
        8px 0 0;

      font-size: 14px;

      font-weight: 800;

      color: #8fa8cb;

      letter-spacing: 1.5px;

      text-transform: uppercase;
    }

    .stats {
      display: flex;

      gap: 12px;
    }

    .stat {
      min-width: 112px;

      padding:
        10px 15px;

      text-align: center;

      border-radius: 12px;

      background: #101f36;

      border:
        1px solid #29466d;
    }

    .stat-label {
      font-size: 10px;

      font-weight: 800;

      letter-spacing: 1px;

      text-transform: uppercase;

      color: #8da5c5;
    }

    .stat-value {
      margin-top: 4px;

      font-size: 24px;

      font-weight: 900;
    }

    /* =====================================================
       ARENA
    ===================================================== */

    .arena {
      position: absolute;

      top: 130px;
      left: 28px;
      right: 28px;
      bottom: 24px;

      overflow: hidden;

      border-radius: 24px;

      background:
        radial-gradient(
          circle at center,
          rgba(
            41,
            89,
            151,
            0.15
          ),
          transparent 54%
        ),
        #091525;

      border:
        1px solid
        rgba(
          86,
          132,
          196,
          0.43
        );

      box-shadow:
        inset
        0
        0
        80px
        rgba(
          0,
          0,
          0,
          0.37
        );
    }

    .arena::after {
      content: "";

      position: absolute;

      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          circle at center,
          transparent 47%,
          rgba(
            0,
            0,
            0,
            0.27
          )
          100%
        );
    }

    /* =====================================================
       QUESTION
    ===================================================== */

    .question-panel {
      position: absolute;

      z-index: 18;

      top: 24px;
      left: 50%;

      transform:
        translateX(-50%);

      width:
        min(
          960px,
          70%
        );

      min-height: 105px;

      padding:
        17px
        110px
        17px
        28px;

      text-align: center;

      border-radius: 17px;

      background:
        rgba(
          7,
          16,
          30,
          0.95
        );

      border:
        1px solid #375d91;

      box-shadow:
        0
        15px
        44px
        rgba(
          0,
          0,
          0,
          0.4
        );

      transition:
        0.3s ease;
    }

    .question-panel.hidden {
      opacity: 0;

      transform:
        translate(
          -50%,
          -18px
        );

      pointer-events: none;
    }

    .round-label {
      color: #facc15;

      font-size: 12px;

      font-weight: 900;

      letter-spacing: 2px;
    }

    .question {
      margin-top: 7px;

      font-size: 27px;

      font-weight: 900;

      line-height: 1.15;
    }

    .timer {
      position: absolute;

      z-index: 22;

      top: 36px;
      left:
        calc(
          50% +
          365px
        );

      width: 67px;
      height: 67px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #0a1628;

      border:
        4px solid #facc15;

      color: #facc15;

      font-size: 28px;

      font-weight: 900;

      box-shadow:
        0
        0
        27px
        rgba(
          250,
          204,
          21,
          0.18
        );
    }

    .timer.hidden {
      display: none;
    }

    /* =====================================================
       ANSWER ZONES
    ===================================================== */

    .zones {
      position: absolute;

      z-index: 4;

      left: 2.5%;
      right: 2.5%;

      bottom: 2.5%;

      height: 51%;

      display: grid;

      grid-template-columns:
        1fr 1fr;

      grid-template-rows:
        1fr 1fr;

      gap: 15px;

      pointer-events: none;
    }

    .zone {
      position: relative;

      overflow: hidden;

      border-radius: 22px;

      border:
        2px solid
        rgba(
          255,
          255,
          255,
          0.08
        );

      background:
        rgba(
          255,
          255,
          255,
          0.025
        );

      transition:
        background
        0.3s ease,
        border
        0.3s ease,
        opacity
        0.3s ease,
        transform
        0.3s ease,
        box-shadow
        0.3s ease;
    }

    .zone::before {
      content: "";

      position: absolute;

      inset: 0;

      opacity: 0.14;

      background:
        radial-gradient(
          circle at center,
          currentColor,
          transparent 68%
        );
    }

    .zone-a {
      color: #d64e4e;
    }

    .zone-b {
      color: #3983e7;
    }

    .zone-c {
      color: #d9b925;
    }

    .zone-d {
      color: #39ae6c;
    }

    .zone-letter {
      position: absolute;

      top: 13px;
      left: 14px;

      width: 42px;
      height: 42px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 11px;

      background:
        rgba(
          0,
          0,
          0,
          0.32
        );

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.12
        );

      color: white;

      font-size: 22px;

      font-weight: 900;
    }

    .zone-answer {
      position: absolute;

      top: 21px;
      left: 68px;
      right: 16px;

      font-size: 18px;

      font-weight: 900;

      color: white;

      text-shadow:
        0
        2px
        5px
        rgba(
          0,
          0,
          0,
          0.7
        );
    }

    .zone.correct {
      opacity: 1;

      border-color:
        #60f598;

      background:
        rgba(
          29,
          166,
          84,
          0.24
        );

      box-shadow:
        inset
        0
        0
        55px
        rgba(
          54,
          255,
          130,
          0.18
        ),
        0
        0
        35px
        rgba(
          54,
          255,
          130,
          0.15
        );

      transform:
        scale(1.012);
    }

    .zone.wrong {
      border-color:
        rgba(
          210,
          62,
          62,
          0.55
        );

      background:
        rgba(
          151,
          29,
          29,
          0.11
        );

      opacity: 0.4;
    }

    /* =====================================================
       PLAYERS
    ===================================================== */

    .players-layer {
      position: absolute;

      z-index: 10;

      inset: 0;

      pointer-events: none;
    }

    .player {
      position: absolute;

      width: 44px;
      height: 58px;

      transform:
        translate(
          -50%,
          -50%
        );

      transition:
        left
        0.7s
        cubic-bezier(
          .17,
          .84,
          .44,
          1
        ),
        top
        0.7s
        cubic-bezier(
          .17,
          .84,
          .44,
          1
        ),
        opacity
        0.55s ease,
        transform
        0.55s ease,
        filter
        0.45s ease;
    }

    .avatar {
      position: relative;

      width: 34px;
      height: 34px;

      margin:
        0 auto;

      border-radius:
        10px
        10px
        8px
        8px;

      background:
        linear-gradient(
          180deg,
          #efc8a7
          0 36%,
          #34567c
          36% 100%
        );

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.78
        );

      box-shadow:
        0
        4px
        7px
        rgba(
          0,
          0,
          0,
          0.45
        ),
        inset
        0
        -6px
        0
        rgba(
          0,
          0,
          0,
          0.12
        );
    }

    .avatar::before {
      content: "";

      position: absolute;

      top: -5px;
      left: 4px;
      right: 4px;

      height: 10px;

      border-radius:
        7px
        7px
        4px
        4px;

      background: #202a3a;

      border-bottom:
        3px solid #e34646;
    }

    .avatar::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: -10px;

      width: 23px;
      height: 12px;

      transform:
        translateX(-50%);

      border-radius:
        0
        0
        6px
        6px;

      background: #27415f;
    }

    .player-name {
      width: 92px;

      margin-left: -24px;
      margin-top: 8px;

      text-align: center;

      font-size: 9px;

      font-weight: 900;

      color: white;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      text-shadow:
        0
        2px
        3px
        #000,
        0
        0
        5px
        #000;

      transition:
        opacity
        0.25s ease;
    }

    /*
      Over 40 spillere:
      skjul navnene.
    */

    .hide-player-names
    .player-name {
      opacity: 0;
    }

    /*
      Top 20
    */

    .top20
    .player {
      width: 52px;
      height: 67px;
    }

    .top20
    .avatar {
      width: 40px;
      height: 40px;
    }

    .top20
    .player-name {
      opacity: 1;

      width: 110px;

      margin-left: -29px;

      font-size: 10px;
    }

    /*
      Top 10
    */

    .top10
    .player {
      width: 60px;
      height: 77px;
    }

    .top10
    .avatar {
      width: 48px;
      height: 48px;
    }

    .top10
    .player-name {
      width: 130px;

      margin-left: -35px;

      font-size: 12px;
    }

    /*
      Eliminering
    */

    .player.dead {
      opacity: 0;

      filter:
        grayscale(1)
        brightness(0.55);

      transform:
        translate(
          -50%,
          -50%
        )
        scale(0.05)
        rotate(28deg);
    }

    .player.no-answer
    .avatar {
      opacity: 0.58;
    }

    /* =====================================================
       WAITING SCREEN
    ===================================================== */

    .waiting-message {
      position: absolute;

      z-index: 8;

      top: 34%;
      left: 50%;

      transform:
        translate(
          -50%,
          -50%
        );

      width:
        min(
          900px,
          85%
        );

      text-align: center;

      transition:
        0.3s ease;
    }

    .waiting-message.hidden {
      opacity: 0;

      pointer-events: none;
    }

    .waiting-title {
      font-size: 55px;

      font-weight: 1000;
    }

    .waiting-subtitle {
      margin-top: 11px;

      font-size: 20px;

      font-weight: 700;

      color: #99acc8;
    }

    .join-code {
      display: inline-block;

      margin-top: 24px;

      padding:
        14px
        28px;

      border-radius: 14px;

      color: #111;

      background: #facc15;

      font-size: 25px;

      font-weight: 900;

      box-shadow:
        0
        0
        28px
        rgba(
          250,
          204,
          21,
          0.17
        );
    }

    /* =====================================================
       EVENT OVERLAY
    ===================================================== */

    .event-overlay {
      position: absolute;

      z-index: 50;

      inset: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity
        0.25s ease;

      background:
        rgba(
          3,
          7,
          13,
          0.18
        );
    }

    .event-overlay.show {
      opacity: 1;
    }

    .event-card {
      min-width: 440px;

      max-width: 75%;

      padding:
        33px
        48px;

      text-align: center;

      border-radius: 22px;

      background:
        rgba(
          7,
          15,
          28,
          0.96
        );

      border:
        2px solid #facc15;

      box-shadow:
        0
        25px
        90px
        rgba(
          0,
          0,
          0,
          0.65
        );

      transform:
        scale(0.86);

      transition:
        transform
        0.3s ease;
    }

    .event-overlay.show
    .event-card {
      transform:
        scale(1);
    }

    .event-small {
      color: #9fb3d0;

      font-size: 13px;

      font-weight: 900;

      letter-spacing: 2px;
    }

    .event-big {
      margin-top: 8px;

      font-size: 46px;

      font-weight: 1000;
    }

    .event-big.yellow {
      color: #facc15;
    }

    /* =====================================================
       TOP TEN MESSAGE
    ===================================================== */

    .topten-banner {
      position: absolute;

      z-index: 35;

      left: 50%;
      bottom: 30px;

      transform:
        translateX(-50%);

      padding:
        10px
        22px;

      border-radius: 999px;

      background:
        rgba(
          250,
          204,
          21,
          0.94
        );

      color: #131313;

      font-size: 16px;

      font-weight: 1000;

      opacity: 0;

      transition:
        opacity
        0.3s ease;
    }

    .topten-banner.show {
      opacity: 1;
    }

    /* =====================================================
       WINNER
    ===================================================== */

    .winner-screen {
      position: absolute;

      z-index: 80;

      inset: 0;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      opacity: 0;

      pointer-events: none;

      background:
        radial-gradient(
          circle at center,
          rgba(
            250,
            204,
            21,
            0.26
          ),
          rgba(
            4,
            9,
            16,
            0.96
          )
          62%
        );

      transition:
        opacity
        0.5s ease;
    }

    .winner-screen.show {
      opacity: 1;
    }

    .trophy {
      font-size: 92px;
    }

    .winner-label {
      margin-top: 9px;

      color: #facc15;

      font-size: 19px;

      font-weight: 900;

      letter-spacing: 4px;
    }

    .winner-name {
      margin-top: 12px;

      font-size: 70px;

      font-weight: 1000;

      text-align: center;

      text-shadow:
        0
        7px
        20px
        rgba(
          0,
          0,
          0,
          0.58
        );
    }

    .winner-subtitle {
      margin-top: 10px;

      color: #a8b8ce;

      font-size: 21px;

      font-weight: 700;
    }

    .connection {
      position: absolute;

      z-index: 100;

      right: 25px;
      bottom: 15px;

      color: #7187a5;

      font-size: 10px;

      font-weight: 800;
    }

  </style>
</head>


<body>

<div
  id="game"
  class="game"
>

  <div class="background-grid"></div>


  <!-- ==================================================
       TOP BAR
  =================================================== -->

  <div class="topbar">

    <div class="brand">

      <img
        src="/pokebua-logo.png"
        class="logo"
        alt="Pokebua"
      />

      <div class="title-wrap">

        <h1>
          LAST TRAINER STANDING
        </h1>

        <p>
          Pokebua Live Game
        </p>

      </div>

    </div>


    <div class="stats">

      <div class="stat">

        <div class="stat-label">
          Spillere
        </div>

        <div
          id="playerCount"
          class="stat-value"
        >
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          Igjen
        </div>

        <div
          id="aliveCount"
          class="stat-value"
        >
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          Runde
        </div>

        <div
          id="roundCount"
          class="stat-value"
        >
          0
        </div>

      </div>

    </div>

  </div>


  <!-- ==================================================
       ARENA
  =================================================== -->

  <div class="arena">


    <!-- QUESTION -->

    <div
      id="questionPanel"
      class="question-panel hidden"
    >

      <div
        id="roundLabel"
        class="round-label"
      >
        RUNDE 1
      </div>

      <div
        id="questionText"
        class="question"
      >
        Spørsmål
      </div>

    </div>


    <div
      id="timer"
      class="timer hidden"
    >
      12
    </div>


    <!-- WAITING -->

    <div
      id="waitingMessage"
      class="waiting-message"
    >

      <div
        id="waitingTitle"
        class="waiting-title"
      >
        POKEBUA GAME
      </div>

      <div
        id="waitingSubtitle"
        class="waiting-subtitle"
      >
        Venter på at spillet skal starte...
      </div>

      <div
        id="joinCode"
        class="join-code"
      >
        !JOIN
      </div>

    </div>


    <!-- ANSWER ZONES -->

    <div class="zones">

      <div
        id="zoneA"
        class="zone zone-a"
      >

        <div class="zone-letter">
          A
        </div>

        <div
          id="zoneAnswerA"
          class="zone-answer"
        ></div>

      </div>


      <div
        id="zoneB"
        class="zone zone-b"
      >

        <div class="zone-letter">
          B
        </div>

        <div
          id="zoneAnswerB"
          class="zone-answer"
        ></div>

      </div>


      <div
        id="zoneC"
        class="zone zone-c"
      >

        <div class="zone-letter">
          C
        </div>

        <div
          id="zoneAnswerC"
          class="zone-answer"
        ></div>

      </div>


      <div
        id="zoneD"
        class="zone zone-d"
      >

        <div class="zone-letter">
          D
        </div>

        <div
          id="zoneAnswerD"
          class="zone-answer"
        ></div>

      </div>

    </div>


    <!-- PLAYERS -->

    <div
      id="playersLayer"
      class="players-layer"
    ></div>

  </div>


  <!-- TOP 10 -->

  <div
    id="topTenBanner"
    class="topten-banner"
  >
    🔥 TOP 10 🔥
  </div>


  <!-- EVENT -->

  <div
    id="eventOverlay"
    class="event-overlay"
  >

    <div class="event-card">

      <div
        id="eventSmall"
        class="event-small"
      ></div>

      <div
        id="eventBig"
        class="event-big"
      ></div>

    </div>

  </div>


  <!-- WINNER -->

  <div
    id="winnerScreen"
    class="winner-screen"
  >

    <div class="trophy">
      🏆
    </div>

    <div class="winner-label">
      LAST TRAINER STANDING
    </div>

    <div
      id="winnerName"
      class="winner-name"
    >
      Winner
    </div>

    <div class="winner-subtitle">
      Vinneren av Pokebua Game!
    </div>

  </div>


  <div
    id="connection"
    class="connection"
  >
    CONNECTING...
  </div>

</div>


<script>

  const socket =
    io();


  let state =
    null;


  let timerInterval =
    null;


  let eventTimeout =
    null;


  let lastAliveCount =
    null;


  const playerElements =
    new Map();


  const $ =
    id =>
      document.getElementById(
        id
      );


  /* =====================================================
     SOCKET
  ===================================================== */


  socket.on(
    "connect",
    () => {

      $("connection")
        .textContent =
        "SERVER ONLINE";

    }
  );


  socket.on(
    "disconnect",
    () => {

      $("connection")
        .textContent =
        "SERVER OFFLINE";

    }
  );


  socket.on(
    "game:update",
    newState => {

      state =
        newState;

      renderState();

    }
  );


  socket.on(
    "game:player-joined",
    player => {

      if (
        state &&
        state.playerCount <= 20
      ) {

        showEvent(
          "NY TRAINER",
          player.name,
          900
        );

      }

    }
  );


  socket.on(
    "game:started",
    data => {

      showEvent(
        "GAME START",
        `${data.playerCount} TRAINERS`,
        1500
      );

    }
  );


  socket.on(
    "game:question",
    () => {

      showEvent(
        "RUNDE STARTER",
        "VELG A / B / C / D",
        1000
      );

    }
  );


  socket.on(
    "game:locked",
    () => {

      showEvent(
        "SVAR LÅST",
        "INGEN FLERE SVAR",
        1100
      );

    }
  );


  socket.on(
    "game:reveal",
    data => {

      showEvent(
        "RIKTIG SVAR",
        data.correct,
        1400,
        true
      );

    }
  );


  socket.on(
    "game:elimination",
    data => {

      showEvent(
        "ELIMINERT",
        `${data.eliminated.length} TRAINERS`,
        1500
      );

    }
  );


  socket.on(
    "game:winner",
    winner => {

      showWinner(
        winner.name
      );

    }
  );


  /* =====================================================
     MAIN RENDER
  ===================================================== */


  function renderState() {

    if (!state) {
      return;
    }


    $("playerCount")
      .textContent =
      state.playerCount ?? 0;


    $("aliveCount")
      .textContent =
      state.aliveCount ?? 0;


    $("roundCount")
      .textContent =
      state.round ?? 0;


    updatePlayerScaleMode();


    renderWaiting();


    renderQuestion();


    renderPlayers();


    renderWinner();


    updateTimer();


    detectTopTen();

  }


  /* =====================================================
     PLAYER SCALE / NAMES
  ===================================================== */


  function updatePlayerScaleMode() {

    const game =
      $("game");


    game.classList
      .remove(
        "hide-player-names",
        "top20",
        "top10"
      );


    const alive =
      state.aliveCount ?? 0;


    /*
      Mer enn 40:
      ingen navn.
    */

    if (
      alive > 40
    ) {

      game.classList
        .add(
          "hide-player-names"
        );

      return;
    }


    /*
      11-20:
      litt større figurer.
    */

    if (
      alive <= 20 &&
      alive > 10
    ) {

      game.classList
        .add(
          "top20"
        );

      return;
    }


    /*
      Top 10:
      enda større.
    */

    if (
      alive <= 10 &&
      alive > 0
    ) {

      game.classList
        .add(
          "top10"
        );

    }

  }


  /* =====================================================
     WAITING / LOBBY
  ===================================================== */


  function renderWaiting() {

    const phase =
      state.phase;


    if (
      phase === "waiting"
    ) {

      $("waitingMessage")
        .classList
        .remove(
          "hidden"
        );


      $("waitingTitle")
        .textContent =
        "POKEBUA GAME";


      $("waitingSubtitle")
        .textContent =
        "Venter på at lobbyen skal åpne...";


      $("joinCode")
        .style
        .display =
        "none";


      return;

    }


    if (
      phase === "lobby"
    ) {

      $("waitingMessage")
        .classList
        .remove(
          "hidden"
        );


      $("waitingTitle")
        .textContent =
        "LOBBY OPEN";


      $("waitingSubtitle")
        .textContent =
        `${state.playerCount} / ${state.maxPlayers} trainers er med`;


      $("joinCode")
        .style
        .display =
        "inline-block";


      return;

    }


    if (
      phase === "ready"
    ) {

      $("waitingMessage")
        .classList
        .remove(
          "hidden"
        );


      $("waitingTitle")
        .textContent =
        "READY?";


      $("waitingSubtitle")
        .textContent =
        `${state.aliveCount} trainers klare`;


      $("joinCode")
        .style
        .display =
        "none";


      return;

    }


    if (
      phase === "finished" &&
      !state.winner
    ) {

      $("waitingMessage")
        .classList
        .remove(
          "hidden"
        );


      $("waitingTitle")
        .textContent =
        "ALLE BLE ELIMINERT";


      $("waitingSubtitle")
        .textContent =
        "Ingen vinner denne runden";


      $("joinCode")
        .style
        .display =
        "none";


      return;

    }


    $("waitingMessage")
      .classList
      .add(
        "hidden"
      );

  }


  /* =====================================================
     QUESTION
  ===================================================== */


  function renderQuestion() {

    const q =
      state.currentQuestion;


    if (!q) {

      $("questionPanel")
        .classList
        .add(
          "hidden"
        );


      clearZones();


      return;

    }


    $("questionPanel")
      .classList
      .remove(
        "hidden"
      );


    $("roundLabel")
      .textContent =
      `RUNDE ${state.round}`;


    $("questionText")
      .textContent =
      q.question;


    $("zoneAnswerA")
      .textContent =
      q.answers?.A || "";


    $("zoneAnswerB")
      .textContent =
      q.answers?.B || "";


    $("zoneAnswerC")
      .textContent =
      q.answers?.C || "";


    $("zoneAnswerD")
      .textContent =
      q.answers?.D || "";


    clearZoneStates();


    if (
      state.revealCorrectAnswer &&
      q.correct
    ) {

      [
        "A",
        "B",
        "C",
        "D"
      ].forEach(
        letter => {

          const zone =
            $(
              `zone${letter}`
            );


          if (
            letter ===
            q.correct
          ) {

            zone.classList
              .add(
                "correct"
              );

          } else {

            zone.classList
              .add(
                "wrong"
              );

          }

        }
      );

    }

  }


  function clearZones() {

    $("zoneAnswerA")
      .textContent = "";


    $("zoneAnswerB")
      .textContent = "";


    $("zoneAnswerC")
      .textContent = "";


    $("zoneAnswerD")
      .textContent = "";


    clearZoneStates();

  }


  function clearZoneStates() {

    [
      "A",
      "B",
      "C",
      "D"
    ].forEach(
      letter => {

        $(
          `zone${letter}`
        )
          .classList
          .remove(
            "correct",
            "wrong"
          );

      }
    );

  }


  /* =====================================================
     PLAYERS
  ===================================================== */


  function renderPlayers() {

    const players =
      state.players || [];


    const alivePlayers =
      players.filter(
        player =>
          player.alive
      );


    /*
      Bruk kun alive players
      for posisjonsberegningen.
    */

    const aliveIndexes =
      new Map();


    alivePlayers.forEach(
      (
        player,
        index
      ) => {

        aliveIndexes.set(
          player.id,
          index
        );

      }
    );


    const liveIds =
      new Set(
        players.map(
          player =>
            String(
              player.id
            )
        )
      );


    /*
      Fjern spillere som faktisk
      ikke finnes i server state.
    */

    playerElements
      .forEach(
        (
          element,
          id
        ) => {

          if (
            !liveIds.has(
              String(id)
            )
          ) {

            element.remove();

            playerElements
              .delete(id);

          }

        }
      );


    players.forEach(
      player => {

        let element =
          playerElements.get(
            player.id
          );


        if (!element) {

          element =
            createPlayerElement(
              player
            );


          playerElements.set(
            player.id,
            element
          );


          $("playersLayer")
            .appendChild(
              element
            );

        }


        const aliveIndex =
          aliveIndexes.has(
            player.id
          )
            ? aliveIndexes.get(
                player.id
              )
            : 0;


        updatePlayerElement(
          element,
          player,
          aliveIndex,
          alivePlayers.length
        );

      }
    );

  }


  function createPlayerElement(
    player
  ) {

    const element =
      document.createElement(
        "div"
      );


    element.className =
      "player";


    element.innerHTML =
      `
        <div class="avatar"></div>

        <div class="player-name">
          ${escapeHtml(
            player.name
          )}
        </div>
      `;


    return element;

  }


  function updatePlayerElement(
    element,
    player,
    aliveIndex,
    aliveTotal
  ) {

    const position =
      getPlayerPosition(
        player,
        aliveIndex,
        aliveTotal
      );


    element.style.left =
      `${position.x}%`;


    element.style.top =
      `${position.y}%`;


    element.classList
      .toggle(
        "dead",
        !player.alive
      );


    element.classList
      .toggle(
        "no-answer",
        player.alive &&
        state.phase ===
          "question" &&
        !player.answer
      );


    const nameElement =
      element.querySelector(
        ".player-name"
      );


    if (
      nameElement
    ) {

      nameElement.textContent =
        player.name;

    }

  }


  /* =====================================================
     PLAYER POSITION
  ===================================================== */


  function getPlayerPosition(
    player,
    index,
    total
  ) {

    /*
      Når spilleren har svart:
      flytt til A/B/C/D.
    */

    if (
      player.alive &&
      player.answer &&
      [
        "A",
        "B",
        "C",
        "D"
      ].includes(
        player.answer
      )
    ) {

      return getZonePosition(
        player.answer,
        player.id,
        index
      );

    }


    /*
      Ellers står spilleren
      i hovedområdet.
    */

    return getLobbyPosition(
      index,
      total,
      player.id
    );

  }


  /* =====================================================
     LOBBY GRID
  ===================================================== */


  function getLobbyPosition(
    index,
    total,
    id
  ) {

    /*
      Hvor mange kolonner vi bruker
      avhenger av antall spillere.
    */

    let cols;


    if (
      total <= 10
    ) {

      cols = 5;

    } else if (
      total <= 20
    ) {

      cols = 8;

    } else if (
      total <= 40
    ) {

      cols = 10;

    } else if (
      total <= 70
    ) {

      cols = 14;

    } else {

      cols = 17;

    }


    const rows =
      Math.ceil(
        Math.max(
          total,
          1
        ) /
        cols
      );


    /*
      Vi bruker nesten hele bredden.
    */

    const minX = 6;
    const maxX = 94;


    /*
      Området over A/B/C/D.
    */

    let minY = 18;
    let maxY = 46;


    /*
      Ved 70-100 spillere får vi
      litt mer høyde.
    */

    if (
      total > 70
    ) {

      minY = 16;
      maxY = 48;

    }


    const row =
      Math.floor(
        index / cols
      );


    const col =
      index % cols;


    /*
      Antall spillere i aktuell rad.
    */

    const playersInRow =
      Math.min(
        cols,
        total -
        row * cols
      );


    /*
      Sentrerer siste rad.
    */

    const rowOffset =
      (
        cols -
        playersInRow
      ) / 2;


    const adjustedCol =
      col +
      rowOffset;


    const x =
      cols <= 1

        ? 50

        : minX +
          (
            adjustedCol /
            Math.max(
              cols - 1,
              1
            )
          ) *
          (
            maxX -
            minX
          );


    const y =
      rows <= 1

        ? (
            minY +
            maxY
          ) / 2

        : minY +
          (
            row /
            Math.max(
              rows - 1,
              1
            )
          ) *
          (
            maxY -
            minY
          );


    /*
      Liten variasjon.
      Ikke så mye at de kolliderer.
    */

    const amount =
      total > 40
        ? 0.35
        : 0.65;


    const jitterX =
      (
        seededRandom(
          id * 91
        ) -
        0.5
      ) *
      amount;


    const jitterY =
      (
        seededRandom(
          id * 153
        ) -
        0.5
      ) *
      amount;


    return {

      x:
        x +
        jitterX,

      y:
        y +
        jitterY

    };

  }


  /* =====================================================
     ANSWER ZONE POSITION
  ===================================================== */


  function getZonePosition(
    answer,
    id,
    index
  ) {

    /*
      Vi fordeler hver spiller
      stabilt over hele svarfeltet.
    */

    const ranges = {

      A: {
        x1: 5,
        x2: 48,
        y1: 58,
        y2: 72
      },

      B: {
        x1: 52,
        x2: 95,
        y1: 58,
        y2: 72
      },

      C: {
        x1: 5,
        x2: 48,
        y1: 79,
        y2: 94
      },

      D: {
        x1: 52,
        x2: 95,
        y1: 79,
        y2: 94
      }

    };


    const range =
      ranges[
        answer
      ];


    /*
      Stable pseudo randomness.
    */

    const rx =
      seededRandom(
        id * 301 +
        index * 17
      );


    const ry =
      seededRandom(
        id * 727 +
        index * 31
      );


    return {

      x:
        range.x1 +
        rx *
        (
          range.x2 -
          range.x1
        ),

      y:
        range.y1 +
        ry *
        (
          range.y2 -
          range.y1
        )

    };

  }


  function seededRandom(
    seed
  ) {

    const x =
      Math.sin(
        seed
      ) *
      10000;


    return (
      x -
      Math.floor(x)
    );

  }


  /* =====================================================
     TIMER
  ===================================================== */


  function updateTimer() {

    clearInterval(
      timerInterval
    );


    timerInterval =
      null;


    if (
      !state.questionEndsAt ||
      state.phase !==
        "question"
    ) {

      $("timer")
        .classList
        .add(
          "hidden"
        );


      return;

    }


    $("timer")
      .classList
      .remove(
        "hidden"
      );


    const tick =
      () => {

        if (
          !state ||
          !state.questionEndsAt
        ) {
          return;
        }


        const end =
          new Date(
            state.questionEndsAt
          ).getTime();


        const remaining =
          Math.max(
            0,
            Math.ceil(
              (
                end -
                Date.now()
              ) /
              1000
            )
          );


        $("timer")
          .textContent =
          remaining;


        if (
          remaining <= 0
        ) {

          clearInterval(
            timerInterval
          );


          timerInterval =
            null;

        }

      };


    tick();


    timerInterval =
      setInterval(
        tick,
        200
      );

  }


  /* =====================================================
     TOP 10
  ===================================================== */


  function detectTopTen() {

    const alive =
      state.aliveCount ?? 0;


    if (
      lastAliveCount !== null &&
      lastAliveCount > 10 &&
      alive <= 10 &&
      alive > 1
    ) {

      showEvent(
        "FINALEN NÆRMER SEG",
        "TOP 10",
        2200,
        true
      );


      $("topTenBanner")
        .classList
        .add(
          "show"
        );


      setTimeout(
        () => {

          $("topTenBanner")
            .classList
            .remove(
              "show"
            );

        },
        4000
      );

    }


    lastAliveCount =
      alive;

  }


  /* =====================================================
     WINNER
  ===================================================== */


  function renderWinner() {

    if (
      state.winner &&
      state.winner.name
    ) {

      showWinner(
        state.winner.name
      );


      return;

    }


    $("winnerScreen")
      .classList
      .remove(
        "show"
      );

  }


  function showWinner(
    name
  ) {

    $("winnerName")
      .textContent =
      name;


    $("winnerScreen")
      .classList
      .add(
        "show"
      );

  }


  /* =====================================================
     EVENTS
  ===================================================== */


  function showEvent(
    small,
    big,
    duration = 1300,
    yellow = false
  ) {

    clearTimeout(
      eventTimeout
    );


    $("eventSmall")
      .textContent =
      small;


    $("eventBig")
      .textContent =
      big;


    $("eventBig")
      .classList
      .toggle(
        "yellow",
        yellow
      );


    $("eventOverlay")
      .classList
      .add(
        "show"
      );


    eventTimeout =
      setTimeout(
        () => {

          $("eventOverlay")
            .classList
            .remove(
              "show"
            );

        },
        duration
      );

  }


  /* =====================================================
     ESCAPE HTML
  ===================================================== */


  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }

</script>
