<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokebua-kø</title>

  <script src="/socket.io/socket.io.js"></script>

  <style>
    :root {
      --background: rgba(7, 10, 22, 0.96);
      --yellow: #ffd900;
      --white: #ffffff;
      --muted: #e6e6e6;
      --blue: #55c8ff;
      --purple: #c478ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      padding: 18px;
    }

    .queue-card {
      position: relative;
      width: 472px;
      min-height: 170px;
      padding: 20px 18px 18px;
      color: var(--white);
      background: var(--background);
      border: 3px solid rgba(255, 217, 0, 0.82);
      border-radius: 22px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
      transition: min-height 0.3s ease;
    }

    .title {
      margin: 0 0 14px;
      text-align: center;
      font-size: 29px;
      color: var(--yellow);
    }

    .section-label {
      margin: 0 0 5px;
      font-size: 15px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .current-box {
      min-height: 42px;
      margin-bottom: 15px;
      padding: 10px 13px;
      display: flex;
      align-items: center;
      border-radius: 14px;
      background: rgba(30, 27, 12, 0.95);
    }

    .current-name {
      font-size: 18px;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .current-empty {
      font-size: 16px;
      font-style: italic;
      color: var(--muted);
    }

    .waiting-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .queue-row {
      display: flex;
      align-items: center;
      min-height: 32px;
      padding: 2px 4px;
      font-size: 19px;
      line-height: 28px;
      font-weight: 800;
      overflow: hidden;
    }

    .queue-number {
      width: 32px;
      flex: 0 0 32px;
      color: var(--yellow);
    }

    .queue-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .queue-row.skip .queue-name {
      color: var(--yellow);
      text-shadow: 0 0 8px rgba(255, 217, 0, 0.2);
    }

    .queue-row.giveaway .queue-name {
      color: #edc7ff;
    }

    .more-count {
      min-height: 33px;
      margin-top: 8px;
      padding-top: 10px;
      text-align: center;
      font-size: 17px;
      font-weight: 900;
      color: var(--yellow);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .more-count:empty {
      display: none;
    }

    .alert-layer {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 24px;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      background: rgba(3, 5, 12, 0.84);
      border-radius: 19px;
    }

    .alert-layer.show {
      visibility: visible;
      animation: fadeIn 0.28s forwards;
    }

    .alert-layer.hide {
      animation: fadeOut 0.34s forwards;
    }

    .alert-box {
      width: 100%;
      padding: 32px 24px;
      text-align: center;
      border-radius: 24px;
      transform: scale(0.78) translateY(18px);
      opacity: 0;
      background: linear-gradient(145deg, #11152a, #050712);
      border: 3px solid var(--yellow);
      box-shadow: 0 0 42px rgba(255, 217, 0, 0.42);
    }

    .alert-layer.show .alert-box {
      animation: pop 0.52s cubic-bezier(0.2, 0.9, 0.25, 1.18) forwards;
    }

    .alert-kicker {
      margin-bottom: 10px;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--yellow);
    }

    .alert-name {
      margin-bottom: 9px;
      font-size: 34px;
      font-weight: 900;
      word-break: break-word;
    }

    .alert-subtitle {
      font-size: 17px;
      line-height: 1.35;
      font-weight: 700;
      color: #e8e8e8;
      word-break: break-word;
    }

    .alert-order .alert-box {
      border-color: var(--blue);
      box-shadow: 0 0 40px rgba(85, 200, 255, 0.4);
    }

    .alert-order .alert-kicker {
      color: #8cdcff;
    }

    .alert-giveaway .alert-box {
      border-color: var(--purple);
      box-shadow: 0 0 42px rgba(196, 120, 255, 0.44);
    }

    .alert-giveaway .alert-kicker {
      color: #e6bfff;
    }

    .alert-skip .alert-box {
      border-color: var(--yellow);
      box-shadow: 0 0 54px rgba(255, 217, 0, 0.58);
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @keyframes fadeOut {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    @keyframes pop {
      0% {
        transform: scale(0.78) translateY(18px);
        opacity: 0;
      }

      70% {
        transform: scale(1.04);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <main class="queue-card">
    <h1 class="title">🔥 POKEBUA-KØ 🔥</h1>

    <div class="section-label">Åpnes nå</div>

    <div class="current-box">
      <div id="currentContent" class="current-empty">Ingen akkurat nå</div>
    </div>

    <div class="section-label">Venter</div>

    <div id="waitingList" class="waiting-list"></div>

    <div id="moreCount" class="more-count"></div>

    <section id="alertLayer" class="alert-layer">
      <div class="alert-box">
        <div id="alertKicker" class="alert-kicker"></div>
        <div id="alertName" class="alert-name"></div>
        <div id="alertSubtitle" class="alert-subtitle"></div>
      </div>
    </section>
  </main>

  <script>
    const socket = io();

    const MAX_VISIBLE = 14;

    const currentContent = document.getElementById("currentContent");
    const waitingList = document.getElementById("waitingList");
    const moreCount = document.getElementById("moreCount");

    const alertLayer = document.getElementById("alertLayer");
    const alertKicker = document.getElementById("alertKicker");
    const alertName = document.getElementById("alertName");
    const alertSubtitle = document.getElementById("alertSubtitle");

    let alertQueue = [];
    let alertPlaying = false;

    function clean(value, fallback = "") {
      const result = String(value ?? "").trim();
      return result || fallback;
    }

    function render(data) {
      const current = data?.current || null;
      const queue = Array.isArray(data?.queue) ? data.queue : [];

      renderCurrent(current);
      renderWaiting(queue);
    }

    function renderCurrent(current) {
      if (!current) {
        currentContent.className = "current-empty";
        currentContent.textContent = "Ingen akkurat nå";
        return;
      }

      const badge = current.skipTheLine
        ? "⚡ "
        : current.giveaway
          ? "🎁 "
          : "";

      currentContent.className = "current-name";
      currentContent.textContent = badge + clean(current.name, "Ukjent");
    }

    function renderWaiting(queue) {
      waitingList.innerHTML = "";

      const visibleQueue = queue.slice(0, MAX_VISIBLE);

      visibleQueue.forEach((entry, index) => {
        const row = document.createElement("div");
        row.className = "queue-row";

        if (entry.skipTheLine || entry.priority) {
          row.classList.add("skip");
        } else if (entry.giveaway) {
          row.classList.add("giveaway");
        }

        const number = document.createElement("span");
        number.className = "queue-number";
        number.textContent = `${index + 1}.`;

        const name = document.createElement("span");
        name.className = "queue-name";

        const badge =
          entry.skipTheLine || entry.priority
            ? "⚡ "
            : entry.giveaway
              ? "🎁 "
              : "";

        name.textContent = badge + clean(entry.name, "Ukjent");

        row.appendChild(number);
        row.appendChild(name);
        waitingList.appendChild(row);
      });

      const hiddenCount = Math.max(queue.length - MAX_VISIBLE, 0);

      moreCount.textContent =
        hiddenCount > 0
          ? `+ ${hiddenCount} ${hiddenCount === 1 ? "annen" : "andre"} i kø`
          : "";
    }

    function addAlert(type, payload = {}) {
      alertQueue.push({
        type,
        name: clean(payload.name, "Ukjent"),
        items: clean(payload.items),
        order: clean(payload.order)
      });

      playNextAlert();
    }

    async function playNextAlert() {
      if (alertPlaying || alertQueue.length === 0) {
        return;
      }

      alertPlaying = true;

      const alert = alertQueue.shift();

      alertLayer.className = `alert-layer alert-${alert.type}`;

      if (alert.type === "skip") {
        alertKicker.textContent = "⚡ SKIP THE LINE ⚡";
        alertName.textContent = alert.name;
        alertSubtitle.textContent = "hopper foran i køen!";
      } else if (alert.type === "giveaway") {
        alertKicker.textContent = "🎁 GIVEAWAY";
        alertName.textContent = alert.name;
        alertSubtitle.textContent =
          alert.items || "Ny giveaway-ordre!";
      } else {
        alertKicker.textContent = "📦 NY ORDRE";
        alertName.textContent = alert.name;
        alertSubtitle.textContent =
          alert.items || alert.order || "Ny ordre mottatt!";
      }

      void alertLayer.offsetWidth;
      alertLayer.classList.add("show");

      const duration =
        alert.type === "skip"
          ? 3800
          : alert.type === "giveaway"
            ? 3200
            : 2600;

      await wait(duration);

      alertLayer.classList.remove("show");
      alertLayer.classList.add("hide");

      await wait(360);

      alertLayer.className = "alert-layer";
      alertPlaying = false;

      playNextAlert();
    }

    function wait(milliseconds) {
      return new Promise(resolve => {
        setTimeout(resolve, milliseconds);
      });
    }

    socket.on("queue:update", render);

    socket.on("order:alert", payload => {
      addAlert("order", payload);
    });

    socket.on("giveaway:alert", payload => {
      addAlert("giveaway", payload);
    });

    socket.on("skip:alert", payload => {
      addAlert("skip", payload);
    });

    fetch("/api/queue")
      .then(response => response.json())
      .then(render)
      .catch(error => {
        console.error("Kunne ikke hente køen:", error);
      });
  </script>
</body>
</html>
