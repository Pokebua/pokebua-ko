<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pokebua-kø</title>
<script src="/socket.io/socket.io.js"></script>
<style>
:root{--bg:rgba(7,10,22,.96);--yellow:#ffd900;--white:#fff}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}
body{padding:18px}.card{position:relative;width:472px;min-height:680px;padding:20px 18px 18px;color:#fff;background:var(--bg);border:3px solid rgba(255,217,0,.82);border-radius:22px;box-shadow:0 14px 34px rgba(0,0,0,.45)}
h1{margin:0 0 14px;text-align:center;font-size:29px;color:var(--yellow)}
.label{margin:0 0 5px;font-size:15px;letter-spacing:1.5px;text-transform:uppercase}
.current{min-height:42px;margin-bottom:15px;padding:10px 13px;display:flex;align-items:center;border-radius:14px;background:rgba(30,27,12,.95)}
.current-name{font-size:18px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{font-size:16px;font-style:italic;color:#e6e6e6}
ol{margin:0;padding:0 0 0 26px;min-height:448px}li{min-height:32px;padding:2px;font-size:19px;line-height:28px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li.skip{color:var(--yellow);text-shadow:0 0 8px rgba(255,217,0,.2)}li.giveaway{color:#edc7ff}
.more{min-height:33px;margin-top:8px;padding-top:10px;text-align:center;font-size:17px;font-weight:900;color:var(--yellow);border-top:1px solid rgba(255,255,255,.05)}
.alert{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:24px;pointer-events:none;opacity:0;visibility:hidden;background:rgba(3,5,12,.84);border-radius:19px}
.alert.show{visibility:visible;animation:fadeIn .28s forwards}.alert.hide{animation:fadeOut .34s forwards}
.alert-box{width:100%;padding:32px 24px;text-align:center;border-radius:24px;transform:scale(.78) translateY(18px);opacity:0;background:linear-gradient(145deg,#11152a,#050712);border:3px solid var(--yellow);box-shadow:0 0 42px rgba(255,217,0,.42)}
.alert.show .alert-box{animation:pop .52s cubic-bezier(.2,.9,.25,1.18) forwards}
.kicker{margin-bottom:10px;font-size:25px;font-weight:900;letter-spacing:1.5px;color:var(--yellow)}.name{margin-bottom:9px;font-size:34px;font-weight:900;word-break:break-word}.sub{font-size:17px;line-height:1.35;font-weight:700;color:#e8e8e8;word-break:break-word}
.alert-order .alert-box{border-color:#55c8ff;box-shadow:0 0 40px rgba(85,200,255,.4)}.alert-order .kicker{color:#8cdcff}
.alert-giveaway .alert-box{border-color:#c478ff;box-shadow:0 0 42px rgba(196,120,255,.44)}.alert-giveaway .kicker{color:#e6bfff}
.alert-skip .alert-box{border-color:var(--yellow);box-shadow:0 0 54px rgba(255,217,0,.58)}
@keyframes fadeIn{to{opacity:1}}@keyframes fadeOut{from{opacity:1}to{opacity:0;visibility:hidden}}@keyframes pop{0%{transform:scale(.78) translateY(18px);opacity:0}70%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<main class="card">
<h1>🔥 POKEBUA-KØ 🔥</h1>
<div class="label">Åpnes nå</div>
<div class="current"><div id="current" class="empty">Ingen akkurat nå</div></div>
<div class="label">Venter</div>
<ol id="list"></ol>
<div id="more" class="more"></div>
<section id="alert" class="alert">
<div class="alert-box">
<div id="kicker" class="kicker"></div>
<div id="alertName" class="name"></div>
<div id="sub" class="sub"></div>
</div>
</section>
</main>
<script>
const socket=io(),MAX_VISIBLE=14;
const currentEl=document.getElementById("current"),listEl=document.getElementById("list"),moreEl=document.getElementById("more");
const alertEl=document.getElementById("alert"),kickerEl=document.getElementById("kicker"),alertNameEl=document.getElementById("alertName"),subEl=document.getElementById("sub");
let alerts=[],playing=false;
const clean=(v,f="")=>String(v??"").trim()||f;
function render(data){
 const current=data?.current||null,queue=Array.isArray(data?.queue)?data.queue:[];
 if(current){currentEl.className="current-name";currentEl.textContent=(current.skipTheLine?"⚡ ":current.giveaway?"🎁 ":"")+clean(current.name,"Ukjent")}
 else{currentEl.className="empty";currentEl.textContent="Ingen akkurat nå"}
 listEl.innerHTML="";
queue.slice(0,MAX_VISIBLE).forEach((entry,index)=>{const li=document.createElement("li");if(entry.skipTheLine||entry.priority)li.className="skip";else if(entry.giveaway)li.className="giveaway";const badge=(entry.skipTheLine||entry.priority)?"⚡ ":entry.giveaway?"🎁 ":"";
li.textContent=`${index+1}. ${badge}${clean(entry.name,"Ukjent")}`;
 const hidden=Math.max(queue.length-MAX_VISIBLE,0);moreEl.textContent=hidden?`+ ${hidden} ${hidden===1?"annen":"andre"} i kø`:"";
}
function addAlert(type,p={}){alerts.push({type,name:clean(p.name,"Ukjent"),items:clean(p.items),order:clean(p.order)});playNext()}
async function playNext(){
 if(playing||!alerts.length)return;playing=true;const a=alerts.shift();
 alertEl.className=`alert alert-${a.type}`;
 if(a.type==="skip"){kickerEl.textContent="⚡ SKIP THE LINE ⚡";alertNameEl.textContent=a.name;subEl.textContent="hopper foran i køen!"}
 else if(a.type==="giveaway"){kickerEl.textContent="🎁 GIVEAWAY";alertNameEl.textContent=a.name;subEl.textContent=a.items||"Ny giveaway-ordre!"}
 else{kickerEl.textContent="📦 NY ORDRE";alertNameEl.textContent=a.name;subEl.textContent=a.items||a.order||"Ny ordre mottatt!"}
 void alertEl.offsetWidth;alertEl.classList.add("show");sound(a.type);await wait(a.type==="skip"?3800:a.type==="giveaway"?3200:2600);alertEl.classList.remove("show");alertEl.classList.add("hide");await wait(360);alertEl.className="alert";playing=false;playNext();
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function sound(type){
 try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC(),now=ctx.currentTime;
  const map={order:[[520,0,.1],[660,.11,.12]],giveaway:[[520,0,.09],[660,.1,.09],[820,.2,.16]],skip:[[320,0,.08],[620,.08,.09],[920,.17,.18]]};
  (map[type]||map.order).forEach(([f,d,t])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=type==="skip"?"sawtooth":"sine";o.frequency.setValueAtTime(f,now+d);g.gain.setValueAtTime(.0001,now+d);g.gain.exponentialRampToValueAtTime(.12,now+d+.015);g.gain.exponentialRampToValueAtTime(.0001,now+d+t);o.connect(g);g.connect(ctx.destination);o.start(now+d);o.stop(now+d+t+.03)});
  setTimeout(()=>ctx.close().catch(()=>{}),1000);
 }catch(e){}
}
socket.on("queue:update",render);socket.on("order:alert",p=>addAlert("order",p));socket.on("giveaway:alert",p=>addAlert("giveaway",p));socket.on("skip:alert",p=>addAlert("skip",p));
fetch("/api/queue").then(r=>r.json()).then(render).catch(console.error);
</script>
</body>
</html>
