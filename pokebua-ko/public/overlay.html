<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=330, initial-scale=1" />
  <title>Pokebua Overlay</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root{
      --w:330px;
      --bg:rgba(7,14,26,.88);
      --panel:rgba(13,25,43,.94);
      --panel-2:rgba(10,21,37,.94);
      --line:rgba(255,255,255,.08);
      --text:#eef7ff;
      --muted:#91a4ba;
      --blue:#2d8cff;
      --green:#21c786;
      --gold:#e2b33b;
      --purple:#9b62ff;
      --red:#ff5364;
      --shadow:0 18px 50px rgba(0,0,0,.38);
      --radius:18px;
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      width:var(--w);
      min-height:100%;
      overflow:hidden;
      background:transparent;
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    body{padding:10px}

    .overlay{
      width:310px;
      display:flex;
      flex-direction:column;
      gap:10px;
      filter:drop-shadow(0 14px 30px rgba(0,0,0,.28));
    }

    .panel{
      position:relative;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:
        radial-gradient(circle at 90% 0%, rgba(45,140,255,.15), transparent 34%),
        linear-gradient(145deg,var(--panel),var(--panel-2));
      box-shadow:var(--shadow);
      backdrop-filter:blur(16px);
    }

    .panel::before{
      content:"";
      position:absolute;
      inset:0 auto 0 0;
      width:3px;
      background:var(--blue);
      box-shadow:0 0 18px rgba(45,140,255,.65);
    }

    .panel.skip::before{background:var(--gold);box-shadow:0 0 18px rgba(226,179,59,.7)}
    .panel.giveaway::before{background:var(--purple);box-shadow:0 0 18px rgba(155,98,255,.7)}

    .section-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:14px 16px 8px 18px;
    }

    .eyebrow{
      font-size:10px;
      line-height:1;
      font-weight:900;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:#d4e7f8;
    }

    .live-dot{
      width:7px;height:7px;border-radius:50%;
      background:var(--green);
      box-shadow:0 0 14px rgba(33,199,134,.85);
      animation:pulse 2s infinite;
    }

    .active-body{
      padding:2px 18px 18px;
      min-height:160px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .active-name{
      margin:2px 0 8px;
      font-size:30px;
      line-height:1.05;
      font-weight:950;
      letter-spacing:-.04em;
      overflow-wrap:anywhere;
      text-shadow:0 3px 20px rgba(0,0,0,.25);
    }

    .active-items{
      color:#d7e6f4;
      font-size:13px;
      line-height:1.45;
      white-space:pre-line;
      max-height:88px;
      overflow:hidden;
    }

    .active-meta{
      display:flex;
      align-items:center;
      gap:8px;
      margin-top:14px;
      color:var(--muted);
      font-size:11px;
      font-weight:700;
    }

    .timer{
      color:#fff;
      font-variant-numeric:tabular-nums;
      letter-spacing:.05em;
    }

    .badge{
      display:none;
      margin-left:auto;
      padding:5px 8px;
      border-radius:999px;
      font-size:9px;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
      border:1px solid transparent;
    }
    .badge.show{display:inline-flex}
    .badge.skip{color:#ffeab0;background:rgba(226,179,59,.12);border-color:rgba(226,179,59,.24)}
    .badge.giveaway{color:#e8d8ff;background:rgba(155,98,255,.12);border-color:rgba(155,98,255,.24)}

    .empty{
      color:var(--muted);
      text-align:center;
      font-size:13px;
      font-style:italic;
      padding:28px 8px;
    }

    .queue-panel{padding-bottom:10px}
    .queue-count{
      min-width:24px;height:24px;padding:0 7px;
      display:grid;place-items:center;
      border-radius:999px;
      color:#fff;
      background:rgba(255,255,255,.07);
      font-size:10px;
      font-weight:900;
    }

    .queue-list{
      display:flex;
      flex-direction:column;
      gap:6px;
      padding:4px 10px 2px 14px;
    }

    .queue-item{
      display:grid;
      grid-template-columns:24px minmax(0,1fr) auto;
      align-items:center;
      gap:9px;
      min-height:44px;
      padding:8px 9px;
      border:1px solid rgba(255,255,255,.055);
      border-radius:12px;
      background:rgba(255,255,255,.035);
      animation:itemIn .35s cubic-bezier(.2,.8,.2,1) both;
    }

    .queue-item.priority{
      border-color:rgba(226,179,59,.18);
      background:linear-gradient(90deg,rgba(226,179,59,.09),rgba(255,255,255,.025));
    }

    .queue-item.giveaway{
      border-color:rgba(155,98,255,.18);
      background:linear-gradient(90deg,rgba(155,98,255,.09),rgba(255,255,255,.025));
    }

    .position{
      width:24px;height:24px;
      display:grid;place-items:center;
      border-radius:8px;
      background:rgba(45,140,255,.11);
      color:#a9d2ff;
      font-size:10px;
      font-weight:900;
    }

    .queue-item.priority .position{background:rgba(226,179,59,.12);color:#ffe29a}
    .queue-item.giveaway .position{background:rgba(155,98,255,.12);color:#dcc3ff}

    .q-copy{min-width:0}
    .q-name{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:13px;
      font-weight:850;
      color:#f1f7ff;
    }
    .q-items{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      margin-top:2px;
      color:var(--muted);
      font-size:9px;
    }
    .q-icon{font-size:12px;opacity:.95}

    .more{
      padding:8px 12px 4px;
      text-align:center;
      color:var(--muted);
      font-size:10px;
      font-weight:800;
    }

    .brand{
      padding:1px 8px 0;
      text-align:center;
      color:rgba(226,237,247,.38);
      font-size:9px;
      font-weight:700;
      letter-spacing:.08em;
    }

    .alert{
      position:fixed;
      top:10px;
      left:10px;
      width:310px;
      z-index:50;
      pointer-events:none;
      transform:translateY(-130%);
      opacity:0;
      transition:transform .38s cubic-bezier(.2,.9,.2,1),opacity .28s ease;
    }
    .alert.show{transform:translateY(0);opacity:1}
    .alert-card{
      padding:14px 16px 14px 18px;
      border:1px solid rgba(255,255,255,.1);
      border-radius:16px;
      background:rgba(8,17,31,.96);
      box-shadow:0 18px 50px rgba(0,0,0,.5);
      backdrop-filter:blur(18px);
    }
    .alert-kicker{
      font-size:9px;
      font-weight:950;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:#8fc4ff;
    }
    .alert.skip .alert-kicker{color:#ffe29a}
    .alert.giveaway .alert-kicker{color:#d9bdff}
    .alert-name{
      margin-top:5px;
      font-size:20px;
      font-weight:950;
      letter-spacing:-.025em;
      overflow-wrap:anywhere;
    }
    .alert-items{
      margin-top:3px;
      color:var(--muted);
      font-size:11px;
      line-height:1.35;
    }

    .swap-out{animation:swapOut .26s ease forwards}
    .swap-in{animation:swapIn .42s cubic-bezier(.16,.85,.25,1) both}

    @keyframes pulse{
      0%,100%{transform:scale(1);opacity:.8}
      50%{transform:scale(1.3);opacity:1}
    }
    @keyframes itemIn{
      from{opacity:0;transform:translateY(8px)}
      to{opacity:1;transform:none}
    }
    @keyframes swapOut{
      to{opacity:0;transform:translateX(-24px)}
    }
    @keyframes swapIn{
      from{opacity:0;transform:translateY(-18px) scale(.985)}
      to{opacity:1;transform:none}
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation:none!important;transition:none!important}
    }
  </style>
</head>
<body>
  <div id="alert" class="alert" aria-live="polite">
    <div class="alert-card">
      <div id="alertKicker" class="alert-kicker">Ny ordre</div>
      <div id="alertName" class="alert-name"></div>
      <div id="alertItems" class="alert-items"></div>
    </div>
  </div>

  <main class="overlay">
    <section id="activePanel" class="panel">
      <div class="section-head">
        <div class="eyebrow">Åpnes nå</div>
        <div class="live-dot" title="Tilkoblet"></div>
      </div>

      <div id="activeBody" class="active-body">
        <div class="empty">Venter på neste åpning…</div>
      </div>
    </section>

    <section class="panel queue-panel">
      <div class="section-head">
        <div class="eyebrow">Neste i kø</div>
        <div id="queueCount" class="queue-count">0</div>
      </div>
      <div id="queueList" class="queue-list">
        <div class="empty">Køen er tom.</div>
      </div>
      <div id="moreCount" class="more" hidden></div>
    </section>

    <div class="brand">Powered by Pokebua</div>
  </main>

  <script>
    (() => {
      const MAX_VISIBLE = 10;
      const socket = io();

      const activePanel = document.getElementById("activePanel");
      const activeBody = document.getElementById("activeBody");
      const queueList = document.getElementById("queueList");
      const queueCount = document.getElementById("queueCount");
      const moreCount = document.getElementById("moreCount");

      const alertEl = document.getElementById("alert");
      const alertKicker = document.getElementById("alertKicker");
      const alertName = document.getElementById("alertName");
      const alertItems = document.getElementById("alertItems");

      let currentId = null;
      let currentStartedAt = null;
      let timerHandle = null;
      let alertHandle = null;

      function clean(value) {
        return String(value ?? "").trim();
      }

      function twitchName(entry) {
        const raw = clean(
          entry?.twitchName ||
          entry?.twitch ||
          entry?.twitch_username ||
          entry?.displayName
        );

        if (!raw) return "";

        return raw
          .replace(/^https?:\/\/(www\.)?twitch\.tv\//i, "")
          .replace(/^twitch\.tv\//i, "")
          .replace(/^@+/, "")
          .split(/[/?#]/)[0]
          .trim();
      }

      function firstName(value) {
        const name = clean(value);
        if (!name) return "Kunde";
        return name.split(/\s+/)[0];
      }

      function displayName(entry) {
        return twitchName(entry) || firstName(entry?.name);
      }

      function safeItems(value) {
        const text = clean(value);
        return text || "Produkter ikke oppgitt";
      }

      function formatTimer(ms) {
        const total = Math.max(0, Math.floor(ms / 1000));
        const minutes = Math.floor(total / 60);
        const seconds = total % 60;
        return `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;
      }

      function renderTimer() {
        const timer = document.getElementById("activeTimer");
        if (!timer || !currentStartedAt) return;
        timer.textContent = formatTimer(Date.now() - currentStartedAt);
      }

      function restartTimer(entry) {
        clearInterval(timerHandle);
        if (!entry) {
          currentStartedAt = null;
          return;
        }

        const parsed = Date.parse(entry.startedAt || entry.openedAt || "");
        currentStartedAt = Number.isFinite(parsed) ? parsed : Date.now();
        renderTimer();
        timerHandle = setInterval(renderTimer, 1000);
      }

      function stateClass(entry) {
        if (entry?.skipTheLine || entry?.priority) return "skip";
        if (entry?.giveaway) return "giveaway";
        return "";
      }

      function renderCurrent(entry) {
        const nextId = entry?.id ?? null;
        const changed = nextId !== currentId;
        currentId = nextId;

        if (changed) {
          activeBody.classList.remove("swap-in");
          activeBody.classList.add("swap-out");
        }

        setTimeout(() => {
          activePanel.classList.remove("skip","giveaway");
          const cls = stateClass(entry);
          if (cls) activePanel.classList.add(cls);

          if (!entry) {
            activeBody.innerHTML = `<div class="empty">Venter på neste åpning…</div>`;
            restartTimer(null);
          } else {
            const badge = cls === "skip"
              ? `<span class="badge skip show">★ Skip the Line</span>`
              : cls === "giveaway"
                ? `<span class="badge giveaway show">🎁 Giveaway</span>`
                : "";

            activeBody.innerHTML = `
              <div class="active-name">${escapeHtml(displayName(entry))}</div>
              <div class="active-items">${escapeHtml(safeItems(entry.items))}</div>
              <div class="active-meta">
                <span>Åpnet i</span>
                <span id="activeTimer" class="timer">00:00</span>
                ${badge}
              </div>
            `;
            restartTimer(entry);
          }

          activeBody.classList.remove("swap-out");
          if (changed) {
            void activeBody.offsetWidth;
            activeBody.classList.add("swap-in");
          }
        }, changed ? 180 : 0);
      }

      function renderQueue(queue = []) {
        queueCount.textContent = queue.length;

        if (!queue.length) {
          queueList.innerHTML = `<div class="empty">Køen er tom.</div>`;
          moreCount.hidden = true;
          return;
        }

        const visible = queue.slice(0, MAX_VISIBLE);
        queueList.innerHTML = visible.map((entry, index) => {
          const priority = entry.skipTheLine || entry.priority;
          const giveaway = entry.giveaway;
          const cls = priority ? "priority" : giveaway ? "giveaway" : "";
          const icon = priority ? "★" : giveaway ? "🎁" : "";
          return `
            <div class="queue-item ${cls}" style="animation-delay:${index * 45}ms">
              <div class="position">${index + 1}</div>
              <div class="q-copy">
                <div class="q-name">${escapeHtml(displayName(entry))}</div>
                <div class="q-items">${escapeHtml(safeItems(entry.items))}</div>
              </div>
              <div class="q-icon">${icon}</div>
            </div>
          `;
        }).join("");

        const remaining = queue.length - visible.length;
        moreCount.hidden = remaining <= 0;
        moreCount.textContent = remaining > 0 ? `+ ${remaining} flere i kø` : "";
      }

      function showAlert(kind, payload = {}) {
        clearTimeout(alertHandle);

        alertEl.classList.remove("skip","giveaway","show");
        if (kind === "skip") alertEl.classList.add("skip");
        if (kind === "giveaway") alertEl.classList.add("giveaway");

        alertKicker.textContent =
          kind === "skip" ? "Skip the Line" :
          kind === "giveaway" ? "Giveaway" :
          "Ny ordre";

        alertName.textContent = displayName(payload);
        alertItems.textContent = safeItems(payload.items);

        void alertEl.offsetWidth;
        alertEl.classList.add("show");

        alertHandle = setTimeout(() => {
          alertEl.classList.remove("show");
        }, 3600);
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&","&amp;")
          .replaceAll("<","&lt;")
          .replaceAll(">","&gt;")
          .replaceAll('"',"&quot;")
          .replaceAll("'","&#039;");
      }

      socket.on("queue:update", ({ current, queue }) => {
        renderCurrent(current);
        renderQueue(Array.isArray(queue) ? queue : []);
      });

      socket.on("order:alert", payload => showAlert("order", payload));
      socket.on("skip:alert", payload => showAlert("skip", payload));
      socket.on("giveaway:alert", payload => showAlert("giveaway", payload));

      fetch("/api/queue")
        .then(res => {
          if (!res.ok) throw new Error("Kunne ikke hente kø");
          return res.json();
        })
        .then(data => {
          renderCurrent(data.current);
          renderQueue(Array.isArray(data.queue) ? data.queue : []);
        })
        .catch(() => {
          renderCurrent(null);
          renderQueue([]);
        });
    })();
  </script>
</body>
</html>
