<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokebua køkontroll</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #111827; color: #f9fafb; }
    main { max-width: 900px; margin: 0 auto; padding: 24px; }
    h1 { margin-top: 0; }
    .panel { background: #1f2937; border: 1px solid #374151; border-radius: 14px; padding: 18px; margin-bottom: 18px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .full { grid-column: 1 / -1; }
    input { width: 100%; padding: 12px; border-radius: 9px; border: 1px solid #4b5563; background: #111827; color: white; font-size: 16px; }
    button { border: 0; border-radius: 9px; padding: 10px 14px; cursor: pointer; font-weight: bold; }
    .primary { background: #facc15; color: #111827; }
    .success { background: #22c55e; color: #052e16; }
    .danger { background: #ef4444; color: white; }
    .muted { background: #374151; color: white; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .current { font-size: 24px; font-weight: bold; color: #facc15; }
    .queue-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid #374151; }
    .queue-item:last-child { border-bottom: 0; }
    .queue-actions { display: flex; gap: 6px; }
    .small { padding: 7px 10px; }
    .details { color: #d1d5db; font-size: 14px; margin-top: 4px; }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .full { grid-column: auto; } }
  </style>
</head>
<body>
<main>
  <h1>Pokebua Rip & Ship-kø</h1>

  <section class="panel">
    <h2>Legg til manuelt</h2>
    <div class="form-grid">
      <input id="name" placeholder="Navn på stream">
      <input id="order" placeholder="Ordrenummer, f.eks. #1842">
      <input class="full" id="items" placeholder="Produkter, f.eks. 6x booster">
      <button class="primary full" id="add">Legg i kø</button>
    </div>
  </section>

  <section class="panel">
    <h2>Åpnes nå</h2>
    <div id="current" class="current">Ingen ordre åpnes nå</div>
    <div class="actions" style="margin-top:14px">
      <button class="success" id="next">Start neste ordre</button>
      <button class="danger" id="finish">Marker ferdig</button>
    </div>
  </section>

  <section class="panel">
    <h2>Venteliste</h2>
    <div id="queue">Køen er tom.</div>
  </section>
</main>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const currentEl = document.getElementById("current");
  const queueEl = document.getElementById("queue");

  async function post(url, body) {
    const response = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined
    });
    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      alert(data.error || "Noe gikk galt");
    }
  }

  function render(data) {
    if (data.current) {
      currentEl.innerHTML = `${escapeHtml(data.current.name)} <div class="details">${escapeHtml(data.current.order)} ${escapeHtml(data.current.items)}</div>`;
    } else {
      currentEl.textContent = "Ingen ordre åpnes nå";
    }

    if (!data.queue.length) {
      queueEl.textContent = "Køen er tom.";
      return;
    }

    queueEl.innerHTML = "";
    data.queue.forEach((item, index) => {
      const row = document.createElement("div");
      row.className = "queue-item";
      row.innerHTML = `
        <div>
          <strong>${index + 1}. ${escapeHtml(item.name)}</strong>
          <div class="details">${escapeHtml(item.order)} ${escapeHtml(item.items)}</div>
        </div>
        <div class="queue-actions">
          <button class="muted small" data-action="up" data-id="${item.id}">↑</button>
          <button class="muted small" data-action="down" data-id="${item.id}">↓</button>
          <button class="danger small" data-action="delete" data-id="${item.id}">Fjern</button>
        </div>`;
      queueEl.appendChild(row);
    });
  }

  function escapeHtml(value) {
    return String(value || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    }[c]));
  }

  document.getElementById("add").addEventListener("click", async () => {
    const name = document.getElementById("name").value.trim();
    const order = document.getElementById("order").value.trim();
    const items = document.getElementById("items").value.trim();
    if (!name) return alert("Skriv inn navn.");
    await post("/api/queue", { name, order, items });
    document.getElementById("name").value = "";
    document.getElementById("order").value = "";
    document.getElementById("items").value = "";
  });

  document.getElementById("next").addEventListener("click", () => post("/api/next"));
  document.getElementById("finish").addEventListener("click", () => post("/api/finish"));

  queueEl.addEventListener("click", async event => {
    const button = event.target.closest("button[data-action]");
    if (!button) return;
    const id = button.dataset.id;
    const action = button.dataset.action;
    if (action === "delete") {
      await fetch(`/api/queue/${id}`, { method: "DELETE" });
    } else {
      await post(`/api/queue/${id}/${action}`);
    }
  });

  socket.on("queue:update", render);
  fetch("/api/queue").then(r => r.json()).then(render);
</script>
</body>
</html>
